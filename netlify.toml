# Netlify Configuration for VSR Sales Engine Frontend (T068)

[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) Client Routing Rewrites
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Security & Hardening Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://vsr-sales-engine-webapi.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
